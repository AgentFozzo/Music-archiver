<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Pink background -->
  <rect width="512" height="512" fill="#f5c1c8"/>
  <!-- Double beamed eighth notes (black) -->
  <!-- Beam -->
  <polygon points="145,130 330,155 330,197 145,172" fill="#000"/>
  <!-- Left stem -->
  <rect x="131" y="130" width="28" height="228" fill="#000"/>
  <!-- Right stem -->
  <rect x="312" y="155" width="28" height="228" fill="#000"/>
  <!-- Left note head -->
  <ellipse cx="148" cy="358" rx="55" ry="46" fill="#000"/>
  <!-- Right note head -->
  <ellipse cx="325" cy="383" rx="48" ry="40" fill="#000"/>
</svg>
